plugins {
    id "com.android.application"
}

def autonomeAppUrl = (project.findProperty("autonomeAppUrl") ?: "").toString().trim()
if (!autonomeAppUrl.isEmpty() && !autonomeAppUrl.matches("^https://[^\\s\"']+$")) {
    throw new GradleException("autonomeAppUrl must be an HTTPS URL.")
}
def escapedAutonomeAppUrl = autonomeAppUrl.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace "br.com.autonome.app"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "br.com.autonome.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.2.0"
        buildConfigField "String", "AUTONOME_APP_URL", "\"${escapedAutonomeAppUrl}\""
    }

    sourceSets {
        main {
            assets.srcDirs = ["$buildDir/generated/autonomeAssets"]
            res.srcDirs = ["src/main/res", "$buildDir/generated/autonomeRes"]
        }
    }
}

def webAssets = [
    "index.html",
    "style.css",
    "app.js",
    "manifest.webmanifest",
    "icon.svg",
    "icon-192.png",
    "icon-512.png",
    "apple-touch-icon.png",
]

tasks.register("copyWebAssets", Copy) {
    from(rootProject.projectDir.parentFile)
    include(webAssets)
    into("$buildDir/generated/autonomeAssets")
}

tasks.register("copyLauncherIcon", Copy) {
    from(rootProject.projectDir.parentFile.toPath().resolve("icon-192.png").toFile()) {
        into("mipmap-xxxhdpi")
        rename { "ic_launcher.png" }
    }
    from(rootProject.projectDir.parentFile.toPath().resolve("icon-192.png").toFile()) {
        into("mipmap-xxxhdpi")
        rename { "ic_launcher_round.png" }
    }
    into("$buildDir/generated/autonomeRes")
}

tasks.named("preBuild").configure {
    dependsOn("copyWebAssets", "copyLauncherIcon")
}
