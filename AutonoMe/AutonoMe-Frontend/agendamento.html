<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutonoMe - Agendamento</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/style.css?v=ux3">
</head>
<body data-topbar="back" data-titulo="Agendamento" data-sem-editar="true" data-pagina="homepage">
    <div class="app-frame">
        <div id="topbar-placeholder"></div>

        <main class="app-conteudo">
            <div class="agendamento-card-wrapper card-box">
                <div class="perfil-cabecalho">
                    <div class="perfil-avatar-grande" id="avatar-profissional">👤</div>
                    <h2 class="perfil-nome" id="nome-profissional">Profissional</h2>
                    <span class="estrelas-rating">★★★★★</span>
                </div>

                <h3 class="subtitulo-lista" style="text-align:center; margin-bottom:16px;">Escolha um horário para atendimento</h3>

                <div class="pedido-form">
                    <label for="data-servico">Data do serviço</label>
                    <input id="data-servico" type="date" required>
                    <label for="horario-servico">Horário</label>
                    <select id="horario-servico">
                        <option value="08:00">08:00</option>
                        <option value="14:00">14:00</option>
                        <option value="16:00">16:00</option>
                    </select>
                    <label for="endereco-servico">Endereço do serviço</label>
                    <input id="endereco-servico" type="text" maxlength="255" placeholder="Rua, número, bairro" required>
                </div>

                <div class="agenda-dias">
                    <span class="dia-cabecalho">Dom</span>
                    <span class="dia-cabecalho">Seg</span>
                    <span class="dia-cabecalho">Ter</span>
                    <span class="dia-cabecalho">Qua</span>
                    <span class="dia-cabecalho">Qui</span>
                    <span class="dia-cabecalho">Sex</span>
                    <span class="dia-cabecalho">Sáb</span>

                    <span class="agenda-horario livre">08:00</span>
                    <span class="agenda-horario ocupado">08:00</span>
                    <span class="agenda-horario livre">08:00</span>
                    <span class="agenda-horario livre">08:00</span>
                    <span class="agenda-horario ocupado">08:00</span>
                    <span class="agenda-horario livre">08:00</span>
                    <span class="agenda-horario livre">08:00</span>

                    <span class="agenda-horario ocupado">14:00</span>
                    <span class="agenda-horario livre">14:00</span>
                    <span class="agenda-horario livre">14:00</span>
                    <span class="agenda-horario ocupado">14:00</span>
                    <span class="agenda-horario livre">14:00</span>
                    <span class="agenda-horario livre">14:00</span>
                    <span class="agenda-horario ocupado">14:00</span>
                </div>

                <button id="btn-contratar" class="btn-submit">Contratar Serviço</button>

                <p id="msg-carregando" class="mensagem-erro" style="color:#2E7D32;">Enviando pedido...</p>
                <p id="msg-erro" class="mensagem-erro">Erro de Conexão. Tente novamente.</p>
            </div>
        </main>

        <div id="bottombar-placeholder"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/menu.js?v=foto1"></script>
    <script src="js/agendamento.js"></script>
    <script>
        const nomeProfissional = new URLSearchParams(window.location.search).get("profissional");
        if (nomeProfissional) {
            const nomeDecod = decodeURIComponent(nomeProfissional);
            document.getElementById("nome-profissional").textContent = nomeDecod;
            const partes = nomeDecod.split(" ");
            const iniciais = partes.length > 1 ? (partes[0][0] + partes[1][0]).toUpperCase() : partes[0].substring(0, 2).toUpperCase();
            document.getElementById("avatar-profissional").textContent = iniciais;
        }

        const btnContratar = document.getElementById("btn-contratar");
        const msgCarregando = document.getElementById("msg-carregando");
        const msgErro = document.getElementById("msg-erro");

        btnContratar.addEventListener("click", function () {
            msgErro.style.display = "none";
            msgCarregando.style.display = "block";
            btnContratar.disabled = true;

            setTimeout(() => {
                msgCarregando.style.display = "none";
                btnContratar.disabled = false;
                btnContratar.textContent = "Pedido Enviado com Sucesso!";
                btnContratar.style.backgroundColor = "#2E7D32";
            }, 1200);
        });
    </script>
</body>
</html>
