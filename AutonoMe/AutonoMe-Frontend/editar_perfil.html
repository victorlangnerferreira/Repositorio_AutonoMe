<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutonoMe - Editar Perfil</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/style.css?v=ux3">
</head>
<body data-topbar="back" data-titulo="Editar Perfil" data-sem-editar="true" data-pagina="perfil">
    <div class="app-frame">
        <div id="topbar-placeholder"></div>

        <main class="app-conteudo">
            <section class="card-box">
                <div class="perfil-avatar-grande" id="avatar-previa" aria-label="Prévia das iniciais do perfil"></div>
                <div class="perfil-foto-controles">
                    <label for="arquivo-foto-perfil" class="btn-escolher-foto">Escolher foto</label>
                    <input class="visualmente-oculto" type="file" id="arquivo-foto-perfil" accept="image/jpeg,image/png,image/webp">
                    <section id="controles-recorte-foto" class="controles-recorte-foto" hidden aria-label="Enquadrar foto de perfil">
                        <div class="foto-recorte-janela"><canvas id="foto-recorte-preview" width="220" height="220" role="img" aria-label="Prévia do enquadramento da foto"></canvas></div>
                        <label for="zoom-foto">Zoom</label>
                        <input type="range" id="zoom-foto" min="100" max="300" value="100">
                        <label for="posicao-horizontal-foto">Posição horizontal</label>
                        <input type="range" id="posicao-horizontal-foto" min="0" max="100" value="50">
                        <label for="posicao-vertical-foto">Posição vertical</label>
                        <input type="range" id="posicao-vertical-foto" min="0" max="100" value="50">
                    </section>
                    <button type="button" class="btn-submit" id="btn-enviar-foto" disabled>Enviar foto</button>
                    <p id="feedback-foto" class="form-feedback" role="status" aria-live="polite"></p>
                </div>
                <h2 class="titulo-secao">Editar Perfil</h2>
                <form id="form-editar-perfil" class="form-editar-perfil">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" minlength="2" maxlength="120" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" maxlength="120" required>

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="15" inputmode="numeric" autocomplete="tel">

                    <button type="submit" class="btn-submit" id="btn-salvar-perfil">Salvar Perfil</button>
                    <p id="feedback-perfil" class="form-feedback" role="status" aria-live="polite"></p>
                </form>
                <a href="perfil.html" class="link-profissional">Voltar ao perfil</a>
            </section>
        </main>

        <div id="bottombar-placeholder"></div>
    </div>

    <script src="js/api.js?v=foto1"></script>
    <script src="js/menu.js?v=foto1"></script>
    <script src="js/editar_perfil.js?v=foto3"></script>
</body>
</html>
