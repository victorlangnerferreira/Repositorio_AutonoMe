<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista_chats</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/style.css?v=ux3">
</head>
<body data-topbar="default" data-pagina="lista_chats">
    <div class="app-frame">
        <div id="topbar-placeholder"></div>

        <main class="app-conteudo">
            <input type="text" class="busca-chat" placeholder="🔍 Buscar conversa...">

            <a href="chat.html?contato=Victor%20Smith" class="item-chat">
                <span class="avatar-circulo"></span>
                <span class="chat-info">
                    <span class="chat-nome">Victor Smith <span class="ponto-online"></span></span>
                    <span class="chat-preview">Que horas fica pronto?</span>
                </span>
                <span class="chat-data">18:40</span>
            </a>

            <a href="chat.html?contato=Luis%20Renato" class="item-chat">
                <span class="avatar-circulo"></span>
                <span class="chat-info">
                    <span class="chat-nome">Luis Renato</span>
                    <span class="chat-preview">Combinado, muito obrigado</span>
                </span>
                <span class="chat-data">12/09/2025</span>
            </a>

            <a href="chat.html?contato=Maria%20Pereira" class="item-chat">
                <span class="avatar-circulo"></span>
                <span class="chat-info">
                    <span class="chat-nome">Maria Pereira</span>
                    <span class="chat-preview">Vamos contratar de novo?</span>
                </span>
                <span class="chat-data">03/09/2025</span>
            </a>

            <a href="chat.html?contato=Ana%20Machado" class="item-chat">
                <span class="avatar-circulo"></span>
                <span class="chat-info">
                    <span class="chat-nome">Ana Machado</span>
                    <span class="chat-preview">Ainda tem horário disponível?</span>
                </span>
                <span class="chat-data">27/08/2025</span>
            </a>

            <a href="chat.html?contato=Gabriel%20Almeida" class="item-chat">
                <span class="avatar-circulo"></span>
                <span class="chat-info">
                    <span class="chat-nome">Gabriel Almeida</span>
                    <span class="chat-preview">Trato feito!</span>
                </span>
                <span class="chat-data">21/08/2025</span>
            </a>
        </main>

        <div id="bottombar-placeholder"></div>
    </div>

    <script src="js/menu.js?v=onboard1"></script>
</body>
</html>
